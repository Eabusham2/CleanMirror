plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = "https://maven.shedaniel.me/" }        // Cloth Config
    maven { url = "https://maven.terraformersmc.com/" }  // Mod Menu
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Settings screen. Compile against them; users install them separately.
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    def v = project.version
    inputs.property "version", v
    filesMatching("fabric.mod.json") { expand "version": v }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ---------------------------------------------------------------------------
// Automated in-game test (not shipped in the mod jar). Launches the real game
// with fake "mod" overlays, a fake health-nametag mod and a fake freecam, and
// screenshots both windows. Run with:  gradle runClientGameTest
// ---------------------------------------------------------------------------
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "cleanmirror-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Same scenario as the game test, but on a normal launch that creates its own world
// (no test-framework lockstep). Run with:  gradle runAutopilot
loom {
    runs {
        autopilot {
            client()
            source sourceSets.gametest
            vmArg "-Dcleanmirror.autopilot=true"
            runDir "build/run/autopilot"
            ideConfigGenerated false
        }
    }
}
