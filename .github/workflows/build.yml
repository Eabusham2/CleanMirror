name: Build & Release

# - Every push / pull request: build the mod and attach the jar to the run as an artifact.
# - Pushing a tag like v1.2.3: build with version 1.2.3 and publish a GitHub Release with the jar.
# - Can also be started by hand from the Actions tab.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -Pmod_version=${{ steps.version.outputs.value }}

      - name: Upload jar as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleanmirror-${{ steps.version.outputs.value }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CleanMirror ${{ steps.version.outputs.value }}
          files: build/libs/*.jar
          generate_release_notes: true
          body: |
            **CleanMirror ${{ steps.version.outputs.value }}** for Minecraft **1.21.11** (Fabric).

            Download `cleanmirror-${{ steps.version.outputs.value }}.jar` below and put it in your `mods` folder with:
            - **Fabric API** (required)
            - **Mod Menu** + **Cloth Config** (optional, for the settings screen)

            Press **F6** in game to open the clean window, then point OBS's Window Capture at **Clean Feed**.
